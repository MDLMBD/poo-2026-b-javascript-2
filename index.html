<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Television</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <section id="TV">
        <label id="lbl-Vol">Vol: 0</label>
        <label id="lbl-CH">CH 1</label>
        <label id="lbl-PWR">PWR</label>
      </section>
      <section id="Control">

        <button id="btn-Power">PWR</button>

        <h2>Vol</h2>
        <button id="btn-VolMas">+</button>
        <button id="btn-VolMenos">-</button>

        <h2>CH</h2>
        <button id="btn-CHMas">+</button>
        <button id="btn-CHMenos">-</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
